name: build
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  goreleaser-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true # zizmor: ignore[cache-poisoning]

      - name: Setup Snapcraft
        uses: samuelmeuli/action-snapcraft@fceeb3c308e76f3487e72ef608618de625fb7fe8 # v3.0.1

      - name: Create Snapcraft cache dirs
        run: |
          mkdir -pv "$HOME/.cache/snapcraft/download"
          mkdir -pv "$HOME/.cache/snapcraft/stage-packages"

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ~> 2
          args: release --clean --skip=publish --snapshot
